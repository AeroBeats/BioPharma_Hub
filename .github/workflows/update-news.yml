name: Update news data

# Regenerates web/data/news.json (RSS fetch + Chinese title translation) and
# commits it back, so the static frontend always has fresh news without a server.
on:
  schedule:
    - cron: "5 * * * *" # hourly, at minute 5 (off the top-of-hour rush)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch and translate news
        run: python scripts/fetch_news.py
        env:
          # Optional: add a MYMEMORY_EMAIL repository secret to raise the daily
          # translation quota. The script works without it.
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/news.json web/data/translations.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            # No [skip ci]: this data commit must re-trigger deploy-pages so the
            # live site picks up fresh news. update-news won't loop because its
            # push trigger is path-limited to scripts/ and this workflow file.
            git commit -m "chore: update news data"
            # Push with PAT so the commit triggers other workflows (deploy-pages).
            # GitHub blocks GITHUB_TOKEN pushes from triggering workflows.
            git push https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.repository }} HEAD:main
          fi

      - name: Trigger Pages deploy
        # Even with PAT, GitHub may still block workflow-created commits from
        # triggering other workflows. Explicitly dispatch deploy-pages to be safe.
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.PERSONAL_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'
